[project]
name = "chatbot"
version = "0.1.0"
description = "QQ bot (NapCat + NoneBot2) with LLM chat"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-orm[default]>=0.8.3",
    "nonebot2[fastapi]>=2.5.0",
    "openai>=3.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "nonebug>=0.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

# Read by bot.py (nonebot.load_from_toml). Each folder in src/plugins is one plugin.
[tool.nonebot]
plugin_dirs = ["src/plugins"]

[tool.nonebot.plugins]
nonebot-plugin-orm = ["nonebot_plugin_orm"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PIE", "RET",
]
# Chinese text uses full-width punctuation (，：（）) on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["bot.py", "src", "tests"]
exclude = ["migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Packages without type information.
module = ["nonebot_plugin_apscheduler.*", "nonebug.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # nonebot-plugin-orm builds its Alembic config the old way.
    "ignore:No path_separator found:DeprecationWarning:alembic",
    "ignore:The version_path_separator:DeprecationWarning:alembic",
]
